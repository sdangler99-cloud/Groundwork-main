<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap to the Beat</title>
<style>
  :root {
    --bg-deep: #0f1420;
    --bg-mid: #1a2236;
    --accent: #7c9cff;
    --accent-soft: #b8c9ff;
    --glow: #a3c4ff;
    --text-soft: #cfd8f0;
    --text-dim: #7c88a8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% 30%, var(--bg-mid), var(--bg-deep) 70%);
    overflow: hidden;
    touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .screen {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    user-select: none;
  }

  .header {
    text-align: center;
    color: var(--text-soft);
  }

  .header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }

  .header p {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0;
  }

  .tap-zone {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .rings {
    position: relative;
    width: min(70vw, 280px);
    height: min(70vw, 280px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .beat-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(163, 196, 255, 0.25);
    transform: scale(0.6);
    opacity: 0;
  }

  .beat-ring.pulse {
    animation: ringPulse var(--beat-dur, 1s) ease-out;
  }

  @keyframes ringPulse {
    0%   { transform: scale(0.55); opacity: 0.9; }
    100% { transform: scale(1.15); opacity: 0; }
  }

  .core {
    position: relative;
    width: 55%;
    height: 55%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-soft), var(--accent) 60%, #4a5fc7 100%);
    box-shadow: 0 0 30px 4px rgba(124, 156, 255, 0.35);
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.18s ease-out;
    z-index: 2;
  }

  .core.breathe {
    animation: breathe var(--beat-dur, 1s) ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }

  .core.tapped {
    transform: scale(0.88) !important;
    box-shadow: 0 0 45px 10px rgba(184, 201, 255, 0.6) !important;
  }

  .tap-ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--glow);
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0.9;
    animation: rippleOut 0.6s ease-out forwards;
  }

  @keyframes rippleOut {
    to { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
  }

  .controls {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .bpm-label {
    color: var(--text-soft);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }

  .bpm-label span {
    color: var(--accent-soft);
    font-weight: 700;
    font-size: 16px;
  }

  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 4px;
    background: rgba(124, 156, 255, 0.25);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-soft);
    box-shadow: 0 0 10px rgba(163, 196, 255, 0.6);
    cursor: pointer;
    border: none;
  }

  input[type="range"]::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--accent-soft);
    box-shadow: 0 0 10px rgba(163, 196, 255, 0.6);
    cursor: pointer;
    border: none;
  }

  .presets {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }

  .preset-btn {
    background: rgba(124, 156, 255, 0.12);
    border: 1px solid rgba(124, 156, 255, 0.3);
    color: var(--text-soft);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
  }

  .preset-btn:active {
    background: rgba(124, 156, 255, 0.3);
  }
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <h1>Tap to the Beat</h1>
    <p>Follow the pulse. Tap whenever feels right.</p>
  </div>

  <div class="tap-zone" id="tapZone">
    <div class="rings">
      <div class="beat-ring" id="ring1"></div>
      <div class="beat-ring" id="ring2"></div>
      <div class="core" id="core"></div>
    </div>
  </div>

  <div class="controls">
    <div class="bpm-label">Pace: <span id="bpmValue">60</span> BPM</div>
    <input type="range" id="bpmSlider" min="30" max="100" value="60" step="1">
    <div class="presets">
      <button class="preset-btn" data-bpm="40">Very slow</button>
      <button class="preset-btn" data-bpm="60">Breathing</button>
      <button class="preset-btn" data-bpm="80">Steady</button>
    </div>
  </div>
</div>

<script>
  const core = document.getElementById('core');
  const ring1 = document.getElementById('ring1');
  const ring2 = document.getElementById('ring2');
  const tapZone = document.getElementById('tapZone');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmValue = document.getElementById('bpmValue');
  const root = document.documentElement;

  let bpm = 60;
  let beatInterval = null;
  let ringToggle = false;

  function beatDurationSeconds(bpm) {
    return (60 / bpm).toFixed(3);
  }

  function applyBpm(newBpm) {
    bpm = newBpm;
    bpmValue.textContent = bpm;
    bpmSlider.value = bpm;
    root.style.setProperty('--beat-dur', beatDurationSeconds(bpm) + 's');
    restartBeat();
  }

  function fireRing() {
    const ring = ringToggle ? ring2 : ring1;
    ringToggle = !ringToggle;
    ring.classList.remove('pulse');
    void ring.offsetWidth; // restart animation
    ring.classList.add('pulse');
  }

  function restartBeat() {
    core.classList.remove('breathe');
    void core.offsetWidth;
    core.classList.add('breathe');

    if (beatInterval) clearInterval(beatInterval);
    fireRing();
    beatInterval = setInterval(fireRing, (60 / bpm) * 1000);
  }

  function handleTap(e) {
    core.classList.add('tapped');
    setTimeout(() => core.classList.remove('tapped'), 160);

    const rect = tapZone.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    const x = point.clientX - rect.left;
    const y = point.clientY - rect.top;

    const ripple = document.createElement('div');
    ripple.className = 'tap-ripple';
    const size = Math.min(rect.width, rect.height) * 0.55;
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    tapZone.appendChild(ripple);
    setTimeout(() => ripple.remove(), 650);
  }

  tapZone.addEventListener('pointerdown', handleTap);

  bpmSlider.addEventListener('input', () => {
    applyBpm(parseInt(bpmSlider.value, 10));
  });

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => applyBpm(parseInt(btn.dataset.bpm, 10)));
  });

  applyBpm(60);
</script>
</body>
</html>
